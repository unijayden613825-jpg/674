<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

    <title>寶可夢加傲樂 - 街機完美復刻版</title>

        body {

            background: #05050b;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        /* 機台外框 */
        .arcade-cabinet {
            width: 100%;
            max-width: 540px;
            height: 100vh;
            max-height: 960px;
            background: linear-gradient(135deg, #0d0b21, #1a153b, #0f0c29);
            border: 5px solid #ffcc00;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            box-shadow: 0 0 40px rgba(255, 204, 0, 0.5), inset 0 0 20px rgba(0, 210, 255, 0.2);
            position: relative;
        }
        /* 機台頂部標頭 */
        .arcade-header {
            text-align: center;
            border-bottom: 2px solid #ffcc00;
            padding-bottom: 4px;
            background: rgba(0,0,0,0.4);
            border-radius: 10px 10px 0 0;
        }
        .arcade-header h1 {
            margin: 0;
            font-size: 18px;
            color: #ffcc00;
            text-shadow: 0 0 10px #ff3366, 2px 2px #000;
            letter-spacing: 1px;
        }
        .arcade-sub {
            font-size: 10px;
            color: #00d2ff;
            font-weight: bold;
        }
        /* 上螢幕：野生寶可夢區 */
        .screen-top {
            background: radial-gradient(circle, #1a237e 0%, #000 90%);
            border: 3px solid #00d2ff;
            border-radius: 10px;
            padding: 8px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 0 0 15px rgba(0, 210, 255, 0.4);
            position: relative;
        }
        .screen-title-top {
            font-size: 11px;
            color: #ffeb3b;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        .wild-pokemon-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .wild-card-box {
            width: 85px;
            height: 110px;
            background: linear-gradient(135deg, #e52d27, #b31217);
            border: 3px solid #fff;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 6px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            position: relative;
        }
        .wild-star {
            background: #000;
            color: #ffd700;
            font-size: 9px;
            padding: 1px 5px;
            border-radius: 6px;
            border: 1px solid #ffd700;
        }
        .wild-name {
            font-size: 13px;
            font-weight: bold;
            text-shadow: 1px 1px #000;
        }
        .hp-bar-bg {
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid #777;
        }
        .hp-bar-fill {
            width: 100%;
            height: 100%;
            background: #2ecc71;
            transition: width 0.4s ease;
        }
        /* 中央動態訊息框 (仿街機對話框) */
        .arcade-dialog {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #ffcc00;
            border-radius: 8px;
            padding: 8px 12px;
            text-align: center;
            font-size: 13px;
            color: #ffcc00;
            font-weight: bold;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 1px 1px #000;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }
        /* 下螢幕：我方出戰橢圓卡匣區 */
        .screen-bottom {
            background: radial-gradient(circle, #004d40 0%, #000 90%);
            border: 3px solid #38ef7d;
            border-radius: 10px;
            padding: 8px;
            height: 35%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 0 0 15px rgba(56, 239, 125, 0.4);
            position: relative;
        }
        .screen-title-bottom {
            font-size: 11px;
            color: #38ef7d;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
